<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<!-- Catalog thumbnail harness (render_thumbs.py, stream T5): 3/4 front view of one GLB on a neutral dark ground. -->
<style>html,body{margin:0;background:#1b1f24;overflow:hidden}canvas{display:block}</style>
<script type="importmap">
{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const params = new URLSearchParams(location.search);
const url = params.get('model');
const S = Number(params.get('size') || 512);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: false });
renderer.setPixelRatio(1);
renderer.setSize(S, S);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
// neutral background = --surface-2 of the web theme, so the PNG sits flush in the catalog panel
scene.background = new THREE.Color('#1b1f24');
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.HemisphereLight(0xffffff, 0x30343a, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
scene.add(key);

new GLTFLoader().load(url, (gltf) => {
  const obj = gltf.scene;
  scene.add(obj);
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const r = Math.max(size.x, size.y, size.z);
  const cam = new THREE.PerspectiveCamera(30, 1, 0.01, 200);
  // 3/4 front view: front faces -Z (assets/manifest.json conventions) → camera on -Z, to +X, slightly above
  const dir = new THREE.Vector3(0.62, 0.38, -1).normalize();
  const target = new THREE.Vector3(center.x, box.min.y + size.y * 0.48, center.z);
  // fit the bounding sphere into the vertical FOV with a small margin
  const radius = box.getBoundingSphere(new THREE.Sphere()).radius;
  const dist = (radius / Math.sin(THREE.MathUtils.degToRad(cam.fov / 2))) * 1.02;
  cam.position.copy(target).addScaledVector(dir, dist);
  cam.lookAt(target);
  key.position.copy(cam.position).add(new THREE.Vector3(-r, r * 1.5, 0));
  renderer.render(scene, cam);
  const info = document.createElement('div');
  info.id = 'done';
  info.textContent = JSON.stringify({ size: size.toArray().map((v) => +v.toFixed(3)) });
  info.style.display = 'none';
  document.body.appendChild(info);
  document.title = 'DONE ' + info.textContent;
}, undefined, (e) => { document.title = 'ERROR ' + e; });
</script>
</body>
</html>
